# ============================================================
# SAVA-X Standard TEST Config
# File: cfgs/SAVA-X/eval/standard.yml
#
# Notes:
# 1) This is the standard evaluation config for eval_SAVAX.py / eval.py.
# 2) Use snake_case keys only; avoid legacy invalid keys such as num-thresh.
# 3) Keep comments and section ordering stable for open-source readability.
# 4) A few training-only keys are retained for compatibility, but are ignored in eval.
# ============================================================

# -----------------------------
# A. Eval Entry & Runtime
# -----------------------------
id: savax_standard
model_type: savax
task_type: error_detection

eval_mode: eval
eval_save_dir: outputs/savax/standard/
eval_folder: eval/test
eval_model_path: outputs/savax/standard/savax_standard/model-best.pth
re_eval: true

gpu_id: ['0']
eval_device: cuda
eval_tool_version: '2018'
eval_transformer_input_type: null       # null means: use transformer_input_type stored in the checkpoint
eval_transformer_input_RFtype: null

# Evaluation reranking
ec_alpha: 1.0

# -----------------------------
# B. Dataset & Paths (EgoMe Test)
# -----------------------------
invalid_video_json: []
dict_file: data/egome/vocabulary_egome.json
vocab_size: 4721

multi_view: true
ego_feature_folder: /path/to/egome/Ego/Feature
exo_feature_folder: /path/to/egome/Exo/Feature

ego_eval_caption_file: /path/to/egome/Annotation/test_Ego_cap.json
exo_eval_caption_file: /path/to/egome/Annotation/test_Exo_cap.json
gt_file_for_eval: ['/path/to/egome/Annotation/test_Ego_cap.json']
gt_file_for_para_eval: ['/path/to/egome/Annotation/test_Ego_para.json']

eval_visual_feature_type: ['tsp']
feature_dim: 512
feature_sample_rate: 1 #Down-sample rate, 2 meams down-sample 2 times(10fps ==> 5fps)
frame_embedding_num: 200 
data_rescale: 1
data_rescale_type: longer_uniform
data_norm: 0

batch_size_for_eval: 64
nthreads: 1
disable_tqdm: false

# -----------------------------
# C. Model Structure (must match checkpoint)
# -----------------------------
num_queries: 20
num_classes: 1
num_feature_levels: 4
dec_layers: 2
enc_layers: 2
nheads: 8
transformer_ff_dim: 512
transformer_dropout_prob: 0.1
with_box_refine: 1
transformer_input_type: queries

max_eseq_length: 20
share_caption_head: 1
disable_mid_caption_heads: false
caption_decoder_type: light
caption_cost_type: loss
cap_nheads: 1
cap_dec_n_points: 4
cap_num_feature_levels: 4
soft_attention: 1
att_hid_size: 512
input_encoding_size: 512
rnn_size: 512
num_layers: 2
drop_prob: 0.4
max_caption_len: 30
wordRNN_input_feats_type: C
fix_xcw: 1

# -----------------------------
# D. SAVA-X Modules
# -----------------------------
# D1) Fusion
fusion_type: cross_attn
direction: bi

# D2) Adaptive Sampler (AS)
adapt_sampler: true
as_n_blocks: 1
k_ratio: 0.9
gate_alpha: 0.3
n_heads: 4

tau_start: 1.0
tau_end: 0.1
tau_decay: 1.0e-3

diversity_coef: 0.0
div_tau: 0.0
vicreg_coef: 0.1
vicreg_var_w: 1.0
vicreg_cov_w: 1.0
vicreg_gamma: 0.2
selent_coef: 1.0e-2

# D3) Scene-adaptive View Embedding (SVE)
view_embed_type: viewdict
sve_n_blocks: 1
num_views: 2
view_init_std: 0.02
view_dropout: 0.0

vd_num_tokens: 64
vd_per_stream: false
vd_learnable_tau: true
vd_ffn_mul: 4
vd_gating: true
viewdict_div_coef: 0.05
loss_view_entropy_w: 0.05

view_strength: 1.0
view_strength_start: 0.2
view_strength_end: 1.0
view_strength_warmup_epochs: 5
tau_warmup_epochs: 5
tau_free_after_warmup: true

view_inject_multilevel: true
view_inject_strength: 0.25
view_inject_stream_id: 0

# D4) BiX depth
bix_n_blocks: 1

# D5) Time PE
use_time_pe: true
time_n_freq: 32

# -----------------------------
# E. Loss/Matcher (for model build compatibility)
# -----------------------------
avg_fore_num: 4.449235922126858
mimic_fine_prior: 0.9213
mimic_overall_prior: 0.7764

set_cost_caption: 0
set_cost_giou: 4
set_cost_bbox: 0
set_cost_class: 2
set_cost_fine: 0
cost_alpha: 0.25
cost_gamma: 2

giou_loss_coef: 4
bbox_loss_coef: 0
cls_loss_coef: 2
count_loss_coef: 2
caption_loss_coef: 2
mimic_overall_loss_coef: 1
mimic_fine_loss_coef: 1

focal_alpha: 0.25
focal_gamma: 2.0
lloss_gau_mask: 1
lloss_beta: 1

# -----------------------------
# F. Metric Policy (fine/overall threshold)
# -----------------------------
w_correct: 0.0
num_thresh: 50
thresh_sampling: quantile
fix_fine_thresh: true
tiou_for_thresh: null

# Set these only if you want to force fixed thresholds, e.g. porting
# validation-selected thresholds to test-time evaluation.
fixed_fine_threshold: null
fixed_overall_threshold: null

# -----------------------------
# G. Compatibility Training Keys (ignored during eval)
# -----------------------------
# These keys are retained for readability and config-family compatibility.
# They do not activate training logic in the eval pipeline.
alt_train: false
alt_start_epoch: 5
alt_freq: 2

# -----------------------------
# H. Misc Compatibility
# -----------------------------
training_scheme: all
adapt_loss_type: adv
grad_reverse: 'true'
view_grl_coef: 1.0

# These values are usually overridden by checkpoint info.json.
# Defaults are kept here so eval can still run without that metadata.
start_from: ''
start_from_mode: last
pretrain: none
pretrain_path: ''
seed: 42
